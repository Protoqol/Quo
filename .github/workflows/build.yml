name: 'publish'
on:
  push:
    branches:
      - release
jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Changelog
        id: changelog
        shell: bash
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || "")
          if [ -z "$PREV_TAG" ]; then
            LOG=$(git log --pretty=format:"* %s")
          else
            LOG=$(git log --pretty=format:"* %s" $PREV_TAG..HEAD)
          fi
          CHANGELOG=$(echo "$LOG" | grep -E "^\* \((feat|fix|ui)\)" || true)
          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="No changes starting with (feat), (fix), or (ui) found."
          fi
          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: setup wasm
        run: |
          rustup target add wasm32-unknown-unknown

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: install trunk
        uses: jetli/trunk-action@v0.5.1
        with:
          version: 'latest'

      - name: install frontend dependencies & update caniuse
        run: |
          npm install
          npx update-browserslist-db@latest

      - name: build app
        uses: tauri-apps/tauri-action@v0.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: quo-v__VERSION__
          releaseName: 'Quo v__VERSION__'
          releaseBody: "${{ steps.changelog.outputs.body }}"
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}